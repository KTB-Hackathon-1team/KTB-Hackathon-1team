spring:
  application:
    name: hackathon
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  jwt:
    access-token-expiration: 30m
    refresh-token-expiration: 14d
  auth:
    refresh-cookie-name: refresh_token
    refresh-cookie-path: /api/auth
  openai:
    api-key: ${OPENAI_API_KEY:}
    realtime-client-secrets-url: ${OPENAI_REALTIME_CLIENT_SECRETS_URL:https://api.openai.com/v1/realtime/client_secrets}
  summarizer:
    base-url: ${SUMMARY_SERVER_URL:http://43.203.217.46:8000/}
    connect-timeout: ${SUMMARY_CONNECT_TIMEOUT:5s}
    read-timeout: ${SUMMARY_READ_TIMEOUT:60s}
  s3:
    region: ${AWS_REGION:ap-northeast-2}
    bucket: ${S3_BUCKET:local-placeholder}
    profile-image-prefix: ${S3_PROFILE_IMAGE_PREFIX:children}
    max-file-size: 5MB
    presigned-url-expiration: 10m
