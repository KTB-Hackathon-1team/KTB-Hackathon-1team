spring:
  application:
    name: hackathon
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ktb_hackathon?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

app:
  jwt:
    access-token-expiration: 30m
    refresh-token-expiration: 14d
    secret: ${JWT_SECRET}
  auth:
    refresh-cookie-name: refresh_token
    refresh-cookie-path: /api/auth
    refresh-cookie-secure: false
    refresh-cookie-same-site: Lax
    cors-allowed-origin: http://localhost:5173
