spring:
  application:
    name: hackathon
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

app:
  jwt:
    access-token-expiration: 30m
    refresh-token-expiration: 14d
  auth:
    refresh-cookie-name: refresh_token
    refresh-cookie-path: /api/auth
