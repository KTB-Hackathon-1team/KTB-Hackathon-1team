spring:
  datasource:
    url: jdbc:h2:mem:hackathon;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  jwt:
    secret: local-only-jwt-secret-change-me-32
  auth:
    refresh-cookie-secure: false
    refresh-cookie-same-site: Lax
    cors-allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
