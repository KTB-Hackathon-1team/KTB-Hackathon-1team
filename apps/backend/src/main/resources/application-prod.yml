spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}

app:
  jwt:
    secret: ${JWT_SECRET}
  auth:
    refresh-cookie-secure: ${COOKIE_SECURE:true}
    refresh-cookie-same-site: '${COOKIE_SAME_SITE:None}'
    cors-allowed-origin: ${CORS_ALLOWED_ORIGIN}
  s3:
    region: ${AWS_REGION}
    bucket: ${S3_BUCKET}
    profile-image-prefix: ${S3_PROFILE_IMAGE_PREFIX:children}

logging:
  level:
    root: INFO
    com.ktb.hackathon: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web.cors: DEBUG
